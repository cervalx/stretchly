name: Custom macOS build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      HUSKY: '0'
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-build
      - name: Lint
        run: |
          if output=$(npm run lint 2>&1); then
            printf '%s\n' "$output"
          else
            printf '%s\n' "$output"
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done <<< "$output"
            exit 1
          fi
      - run: npm rebuild node-desktop-idle-v2
      - run: npm test
      - name: Build Apple Silicon app
        run: npm run dist -- --mac dmg --arm64 --publish never --config.mac.hardenedRuntime=false
      - name: Verify app signature
        run: codesign --verify --deep --strict --verbose=2 dist/mac-arm64/Stretchly.app
      - uses: actions/upload-artifact@v6
        with:
          name: Stretchly-alternating-groups-macOS-arm64
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
